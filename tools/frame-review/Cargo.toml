[package]
name = "frame-review"
version = "0.1.0"
edition = "2021"
description = "Check/X frame-by-frame review server for rendered part images"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
