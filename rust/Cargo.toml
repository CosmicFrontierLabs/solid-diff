[package]
name = "solid-diff"
version = "0.1.0"
edition = "2021"
description = "Read SolidWorks part files (SLDPRT), extract Parasolid B-rep, tessellate and render"
license = "MIT"

[dependencies]
flate2 = "1"
spade = "2"
clap = { version = "4", features = ["derive"] }
png = "0.18.1"
gif = "0.14.2"
opencascade-sys = { version = "0.2.0", optional = true }
cxx = { version = "1.0.198", optional = true }

[profile.release]
opt-level = 3

[lib]
name = "solid_diff"
path = "src/lib.rs"

[[bin]]
name = "solid-diff"
path = "src/bin/solid_diff.rs"

[features]
default = ["occt"]
occt = ["dep:opencascade-sys", "dep:cxx"]
